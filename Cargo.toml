[package]
name = "udp-over-tcp"
description = "Command-line tool for tunneling UDP datagrams over TCP with advanced per-flow socket management."
version = "0.2.0"
edition = "2021"
authors = ["Nicolas St-Pierre <nick.stpierre@gmail.com>"]
repository = "https://github.com/nicktdot/udp-over-tcp"
homepage = "https://github.com/nicktdot/udp-over-tcp"
keywords = ["networking", "tcp", "udp", "tunnel", "proxy"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.70.0"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
eyre = "0.6.12"
tokio = { version = "1.49.0", features = ["rt", "macros", "net", "time", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
lexopt = "0.3.2"



# TODO: watch out for https://github.com/axodotdev/cargo-dist/issues/253
# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
